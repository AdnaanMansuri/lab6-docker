<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab 6 — Docker</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1e3a5f, var(--bg));
        color: var(--text);
        padding: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 40px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .whale { font-size: 64px; line-height: 1; }
      h1 { margin: 16px 0 8px; font-size: 1.6rem; }
      p { color: var(--muted); margin: 8px 0; }
      code {
        background: #0b1220;
        padding: 2px 8px;
        border-radius: 6px;
        color: var(--accent);
        font-size: 0.9em;
      }
      .pill {
        display: inline-block;
        margin-top: 20px;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        color: var(--accent);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="whale">🐳</div>
      <h1>Hello from inside a Docker container!</h1>
      <p>This Node.js + Express app was built into a Docker image and is running in a container.</p>
      <p>Host port mapped to container port <code>3000</code>.</p>
      <a class="pill" href="/health">Check /health &rarr;</a>
    </main>
  </body>
</html>
